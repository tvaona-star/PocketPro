# Pocket Pro CI — the "Mac in the cloud" for a Windows + iPhone development setup.
#
# Job 1 (core-tests):  runs the full PocketProCore XCTest suite natively.
# Job 2 (build-ipa):   compiles the whole iOS app (this is the compile check the
#                      Windows machine can't do) and uploads an UNSIGNED .ipa
#                      artifact. AltServer/AltStore re-signs it during sideload,
#                      so no Apple Developer account is needed (docs/NO_MAC_GUIDE.md).
#
# Triggers: every push, plus the Run-workflow button (workflow_dispatch).
name: iOS CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core engine tests (swift test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run PocketProCore test suite
        run: swift test --package-path PocketProCore

  build-ipa:
    name: Build app + unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketPro.xcodeproj \
            -scheme PocketPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/PocketPro.app" Payload/
          zip -qr PocketPro-unsigned.ipa Payload
          ls -la PocketPro-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPro-unsigned-ipa
          path: PocketPro-unsigned.ipa
          retention-days: 30

  # Optional sanity build for the simulator in Debug configuration — catches
  # Debug-only compile issues (e.g. #if DEBUG paths). Cheap to keep.
  build-simulator:
    name: Build app (simulator, Debug)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketPro.xcodeproj \
            -scheme PocketPro \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build
